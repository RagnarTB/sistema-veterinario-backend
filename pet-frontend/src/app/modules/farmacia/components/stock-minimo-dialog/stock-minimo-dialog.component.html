<div class="dialog-container stock-dialog">
    <div class="dialog-header stock-header">
        <h2 class="title">
            <span class="material-icons-round">notifications_active</span>
            Configurar Alerta de Stock
        </h2>
    </div>

    <div class="dialog-content stock-content">
        <div class="product-block">
            <p class="product-label">Producto</p>
            <p class="product-name">{{ data.productoNombre }}</p>
        </div>

        <div class="form-group">
            <label class="stock-label" for="stockInput">Stock Mínimo Deseado</label>
            <div class="input-wrap">
                <input id="stockInput" type="number" [(ngModel)]="stockMinimo" class="stock-input" placeholder="0.00"
                    min="0" step="0.01">
                <span class="material-icons-round stock-icon">inventory_2</span>
            </div>
            <p class="helper-text">
                El sistema emitirá una alerta visual cuando el stock actual sea igual o menor a este valor.
            </p>
        </div>

        <div class="actions">
            <button class="btn btn-secondary" type="button" (click)="cerrar()">Cancelar</button>
            <button class="btn btn-primary" type="button" (click)="guardar()" [disabled]="stockMinimo < 0">
                Guardar Configuración
            </button>
        </div>
    </div>
</div>
