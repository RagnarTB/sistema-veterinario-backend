<div class="page-container p-6 max-w-7xl mx-auto animation-fade-in"
    style="padding: 24px; max-width: 1280px; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px;">
        <div>
            <h1 style="font-size: 24px; font-weight: 700; color: #1e293b; margin: 0;">Tamaños de Jaulas</h1>
            <p style="font-size: 14px; color: #64748b; margin: 4px 0 0 0;">Configuración de dimensiones (Ej. Pequeña, Mediana, Grande)</p>
        </div>
        <div>
            <button mat-flat-button color="primary" class="!rounded-xl shadow-sm"
                style="border-radius: 12px; height: 40px; font-weight: 500;" (click)="abrirModal()">
                <mat-icon style="vertical-align: middle; margin-right: 4px;">add</mat-icon> Nuevo Tamaño
            </button>
        </div>
    </div>

    <div style="background: white; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05); overflow: hidden; position: relative;">

        <div *ngIf="loading()"
            style="position: absolute; inset: 0; background: rgba(255,255,255,0.7); z-index: 10; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(4px);">
            <mat-spinner diameter="35"></mat-spinner>
        </div>

        <table mat-table [dataSource]="dataSource()" style="width: 100%; box-shadow: none;">

            <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef style="font-weight: 600; color: #475569;"> Nombre </th>
                <td mat-cell *matCellDef="let element" style="font-weight: 500; color: #1e293b;"> {{element.nombre}} </td>
            </ng-container>

            <ng-container matColumnDef="estado">
                <th mat-header-cell *matHeaderCellDef style="font-weight: 600; color: #475569;"> Estado </th>
                <td mat-cell *matCellDef="let element">
                    <span [ngStyle]="{'background-color': element.activo ? '#dcfce7' : '#fee2e2', 'color': element.activo ? '#166534' : '#991b1b'}"
                          style="padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600;">
                        {{element.activo ? 'Activo' : 'Inactivo'}}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="acciones">
                <th mat-header-cell *matHeaderCellDef style="font-weight: 600; color: #475569; text-align: right;"> Acciones </th>
                <td mat-cell *matCellDef="let element" style="text-align: right;">
                    <button mat-icon-button (click)="abrirModal(element)" matTooltip="Editar">
                        <mat-icon style="color: #64748b;">edit</mat-icon>
                    </button>
                    <button mat-icon-button (click)="eliminar(element.id)" matTooltip="Eliminar">
                        <mat-icon style="color: #ef4444;">delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns" style="background-color: #f8fafc;"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" style="transition: background-color 0.2s; cursor: pointer;"></tr>
            
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="3" style="text-align: center; padding: 40px; color: #64748b;">
                    No hay tamaños registrados.
                </td>
            </tr>
        </table>
    </div>
</div>
