<div style="padding: 24px; font-family: system-ui, -apple-system, sans-serif;">
  <h2 style="margin: 0 0 16px 0; font-size: 20px; font-weight: 600; color: #1e293b;">
    Registrar Monitoreo
  </h2>
  <p style="margin: 0 0 20px 0; font-size: 14px; color: #64748b;">Paciente: <strong>{{ data.pacienteNombre }}</strong></p>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    
    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 6px;">Tipo de Acción</label>
      <select formControlName="tipoAccion" style="width: 100%; padding: 10px 12px; background: white; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 14px;">
        <option value="CONTROL_SIGNOS">Control de Signos Vitales</option>
        <option value="APLICACION_MEDICAMENTO">Aplicación de Medicamento</option>
        <option value="ALIMENTACION">Alimentación</option>
        <option value="LIMPIEZA">Limpieza de Jaula</option>
        <option value="OTROS">Otros</option>
      </select>
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 6px;">Descripción / Observaciones</label>
      <textarea formControlName="descripcion" rows="3"
        style="width: 100%; padding: 10px 12px; background: white; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 14px; resize: vertical;"
        placeholder="Describa el estado del paciente..."></textarea>
    </div>

    <div style="margin-bottom: 16px; background-color: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #475569; cursor: pointer;">
        <input type="checkbox" formControlName="aplicaMedicamento" style="width: 16px; height: 16px;">
        ¿Se aplicó algún medicamento o producto?
      </label>
    </div>

    <div *ngIf="form.get('aplicaMedicamento')?.value" style="background-color: #f0fdf4; padding: 16px; border-radius: 8px; border: 1px solid #bbf7d0; margin-bottom: 16px;">
      
      <div style="margin-bottom: 12px;">
        <label style="display: block; font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 6px;">Origen del Medicamento</label>
        <select formControlName="origenMedicamento" style="width: 100%; padding: 10px 12px; background: white; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 14px;">
          <option value="CLINICA">Stock de la Clínica (Se cobrará al final)</option>
          <option value="CLIENTE">Traído por el Cliente (No se cobra)</option>
        </select>
      </div>

      <div *ngIf="form.get('origenMedicamento')?.value === 'CLIENTE'" style="margin-top: 12px;">
        <label style="display: block; font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 6px;">Nombre del medicamento traído</label>
        <input formControlName="nombreMedicamentoTraido" type="text"
          style="width: 100%; padding: 10px 12px; background: white; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 14px;"
          placeholder="Ej: Meloxicam 5mg">
      </div>

      <div *ngIf="form.get('origenMedicamento')?.value === 'CLINICA'" style="display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-top: 12px;">
        <div style="position: relative;">
          <label style="display: block; font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 6px;">Buscar Producto (Inventario)</label>
          <div style="position: relative;">
            <span class="material-icons-round" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 18px;">search</span>
            <input formControlName="productoQuery" type="text"
              (input)="onProductoSearch($any($event.target).value)"
              style="width: 100%; padding: 10px 12px 10px 36px; background: white; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 14px;"
              placeholder="Buscar por nombre...">
              <mat-spinner *ngIf="buscandoProducto()" diameter="16" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);"></mat-spinner>
          </div>
          
          <div *ngIf="productosFiltrados().length > 0" style="position: absolute; z-index: 10; width: 100%; background: white; border: 1px solid #e2e8f0; border-radius: 8px; margin-top: 4px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-height: 200px; overflow-y: auto;">
            <div *ngFor="let p of productosFiltrados()" (click)="seleccionarProducto(p)"
                 style="padding: 10px 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
              <div>
                <div style="font-size: 13px; font-weight: 600; color: #1e293b;">{{ p.nombre }}</div>
                <div style="font-size: 11px; color: #64748b;">Stock: {{ p.stockActual || 0 }} unidades</div>
              </div>
              <span style="font-size: 13px; font-weight: 600; color: #10b981;">S/ {{ p.precio }}</span>
            </div>
          </div>
        </div>
        
        <div>
          <label style="display: block; font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 6px;">Cantidad</label>
          <div style="position: relative;">
            <input formControlName="cantidadAplicada" type="number" step="0.01"
              style="width: 100%; padding: 10px 30px 10px 12px; background: white; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 14px;"
              placeholder="0.00">
            <span *ngIf="productoSeleccionado()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #64748b; pointer-events: none;">
              u.
            </span>
          </div>
        </div>
      </div>
      
    </div>
    
    <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
      <button type="button" mat-button (click)="dialogRef.close()" style="border-radius: 8px;">Cancelar</button>
      <button type="submit" mat-flat-button color="primary" style="border-radius: 8px;" [disabled]="form.invalid || saving()">
        <mat-spinner *ngIf="saving()" diameter="20" style="display: inline-block; margin-right: 8px;"></mat-spinner>
        Guardar Registro
      </button>
    </div>
  </form>
</div>
