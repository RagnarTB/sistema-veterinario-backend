<h2 mat-dialog-title>Registrar Desparasitación</h2>

<mat-dialog-content>
    <form [formGroup]="form" class="dialog-form" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
        
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1rem;">
            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Tipo</mat-label>
                <mat-select formControlName="tipo" required>
                    <mat-option value="INTERNA">Interna</mat-option>
                    <mat-option value="EXTERNA">Externa</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Producto Utilizado</mat-label>
                <input matInput formControlName="productoUtilizado" placeholder="Ej: Bravecto, NexGard" required>
                <mat-error *ngIf="form.get('productoUtilizado')?.hasError('required')">El producto es obligatorio</mat-error>
            </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Peso al momento (kg)</mat-label>
            <input matInput type="number" formControlName="pesoAlMomento" step="0.1" placeholder="Ej: 12.5">
        </mat-form-field>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Fecha de Aplicación</mat-label>
                <input matInput [matDatepicker]="pickerApp" formControlName="fechaAplicacion" [max]="today" required>
                <mat-datepicker-toggle matIconSuffix [for]="pickerApp"></mat-datepicker-toggle>
                <mat-datepicker #pickerApp></mat-datepicker>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Próxima Dosis (Opcional)</mat-label>
                <input matInput [matDatepicker]="pickerProx" formControlName="fechaProximaDosis" [min]="form.get('fechaAplicacion')?.value || today">
                <mat-datepicker-toggle matIconSuffix [for]="pickerProx"></mat-datepicker-toggle>
                <mat-datepicker #pickerProx></mat-datepicker>
            </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Observaciones</mat-label>
            <textarea matInput formControlName="observaciones" rows="2"></textarea>
        </mat-form-field>

    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close [disabled]="loading()">Cancelar</button>
    <button mat-flat-button color="accent" (click)="guardar()" [disabled]="form.invalid || loading()">
        <mat-icon *ngIf="!loading()">save</mat-icon>
        <mat-spinner *ngIf="loading()" diameter="20" style="margin-right: 8px; display: inline-block; vertical-align: middle;"></mat-spinner>
        Guardar
    </button>
</mat-dialog-actions>
