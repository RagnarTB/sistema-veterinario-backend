<h2 mat-dialog-title>Registrar Vacunación</h2>

<mat-dialog-content>
    <form [formGroup]="form" class="dialog-form" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
        
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Nombre de la Vacuna</mat-label>
            <input matInput formControlName="nombreVacuna" placeholder="Ej: Rabia, Triple Felina" required>
            <mat-error *ngIf="form.get('nombreVacuna')?.hasError('required')">El nombre es obligatorio</mat-error>
        </mat-form-field>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Fecha de Aplicación</mat-label>
                <input matInput [matDatepicker]="pickerApp" formControlName="fechaAplicacion" [max]="today" required>
                <mat-datepicker-toggle matIconSuffix [for]="pickerApp"></mat-datepicker-toggle>
                <mat-datepicker #pickerApp></mat-datepicker>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Próxima Dosis (Opcional)</mat-label>
                <input matInput [matDatepicker]="pickerProx" formControlName="fechaProximaDosis" [min]="form.get('fechaAplicacion')?.value || today">
                <mat-datepicker-toggle matIconSuffix [for]="pickerProx"></mat-datepicker-toggle>
                <mat-datepicker #pickerProx></mat-datepicker>
            </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Observaciones (Lote, Marca, Efectos, etc)</mat-label>
            <textarea matInput formControlName="observaciones" rows="3"></textarea>
        </mat-form-field>

    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close [disabled]="loading()">Cancelar</button>
    <button mat-flat-button color="primary" (click)="guardar()" [disabled]="form.invalid || loading()">
        <mat-icon *ngIf="!loading()">save</mat-icon>
        <mat-spinner *ngIf="loading()" diameter="20" style="margin-right: 8px; display: inline-block; vertical-align: middle;"></mat-spinner>
        Guardar
    </button>
</mat-dialog-actions>
