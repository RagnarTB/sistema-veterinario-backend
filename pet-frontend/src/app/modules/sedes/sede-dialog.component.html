<div class="custom-dialog-container">
  <h2 mat-dialog-title class="dialog-header">
    <mat-icon class="brand-icon">pets</mat-icon>
    <span class="title-text">{{ isEdit() ? 'Editar Sede' : 'Nueva Sede' }}</span>
  </h2>

  <mat-dialog-content class="dialog-content">
    <form [formGroup]="form" class="form-layout">
      
      <mat-form-field appearance="outline" class="form-field-custom">
        <mat-label>Nombre de la Sede</mat-label>
        <mat-icon matPrefix class="input-icon">store</mat-icon>
        <input matInput formControlName="nombre" placeholder="Ej. Sede Central" />
        <mat-error *ngIf="form.get('nombre')?.hasError('required')">El nombre es obligatorio</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-custom">
        <mat-label>Dirección</mat-label>
        <mat-icon matPrefix class="input-icon">location_on</mat-icon>
        <input matInput formControlName="direccion" placeholder="Ej. Av. Principal 123" />
        <mat-error *ngIf="form.get('direccion')?.hasError('required')">La dirección es obligatoria</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-custom">
        <mat-label>Teléfono</mat-label>
        <mat-icon matPrefix class="input-icon">phone</mat-icon>
        <input matInput formControlName="telefono" placeholder="Ej. 987654321" maxlength="9" (keydown)="soloNumeros($event)"/>
        <mat-error *ngIf="form.get('telefono')?.hasError('required')">El teléfono es obligatorio</mat-error>
      </mat-form-field>

    </form>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions-layout">
    <button mat-flat-button mat-dialog-close class="btn-cancel">
      Cancelar
    </button>

    <button mat-flat-button class="btn-submit" [disabled]="form.invalid || loading()" (click)="guardar()">
      <mat-icon class="btn-icon">add</mat-icon>
      <span>{{ loading() ? 'Guardando...' : (isEdit() ? 'Guardar Cambios' : 'Registrar Sede') }}</span>
    </button>
  </mat-dialog-actions>
</div>
