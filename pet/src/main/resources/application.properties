spring.application.name=pet

# Importar archivo de secretos local si existe (ignorado por Git)
spring.config.import=optional:classpath:application-secrets.properties

# Configuración de base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:VetCare}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración de Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Deshabilitar la consola H2 ya que usamos Postgres
spring.h2.console.enabled=false
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Credenciales fijas para desarrollo inicial
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# JWT
jwt.secret=${JWT_SECRET:CLAVE_POR_DEFECTO_SOLO_PARA_PRUEBAS_1234567890}

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:ldtb2001@gmail.com}
spring.mail.password=${MAIL_PASSWORD:password_de_aplicacion_aqui}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Google OAuth
google.oauth.client-id=${GOOGLE_CLIENT_ID:tu_client_id_google_aqui}

app.frontend.url=${FRONTEND_URL:http://localhost:4200}